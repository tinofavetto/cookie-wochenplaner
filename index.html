<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#1f2a1f;--mut:#6b7468;--line:#e6e2d6;--g:#2e7d32;--g2:#e8f3e6;--o:#e8772e;--o2:#fdeee3;--r:#b3261e;--r2:#fbe9e7;--rad:18px;--sh:0 2px 10px rgba(40,50,30,.08)}

html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit}
a{color:var(--g)}
header{position:sticky;top:0;z-index:5;background:rgba(247,245,239,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:9px}
header .t{flex:1;min-width:0}
header h1{font-size:18px;margin:0;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:13px;color:var(--mut)}
.chip{font-size:12px;padding:5px 9px;border-radius:99px;background:#eee;color:var(--mut);white-space:nowrap;border:0}
.chip.ok{background:var(--g2);color:var(--g)}.chip.busy{background:#fff4d6;color:#8a6100}.chip.err{background:var(--r2);color:var(--r)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:none;padding:8px 4px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--g);font-weight:600}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);margin:0 0 16px;overflow:hidden}
.pad{padding:14px 16px}
.day{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 8px}
.strip{position:sticky;top:var(--hh,60px);z-index:4;background:var(--bg);display:flex;gap:4px;margin:0 -14px 10px;padding:6px 14px 8px}
.strip button{flex:1;min-width:0;border:0;border-radius:12px;background:#fff;box-shadow:var(--sh);padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);font-size:13px;font-weight:600;line-height:1.1}
.strip button small{font-size:11px;font-weight:500;color:var(--mut)}
.strip button i{font-style:normal;font-size:11px;height:13px;line-height:13px;color:var(--mut)}
.strip button i .s-bestaetigt{color:var(--g)}.strip button i .s-ersetzt{color:var(--o)}.strip button i .s-abgelehnt{color:var(--r)}.strip button i .s-offen{opacity:.55}.strip button.cur i span{color:#fff}
.strip button.today{box-shadow:inset 0 0 0 2px var(--g)}
.strip button.cur{background:var(--g);color:#fff}.strip button.cur small,.strip button.cur i{color:#fff}
.strip button.past:not(.cur){opacity:.6}
.swipe{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -14px;touch-action:pan-x pan-y}
.swipe::-webkit-scrollbar{display:none}

.today-tag{font-size:11px;font-weight:700;color:var(--g);background:var(--g2);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.slot{display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px 6px;font-size:14.5px}.slot span{font-size:12.5px;color:var(--mut)}
.card.ev .pic{aspect-ratio:16/8}
.fix{display:flex;justify-content:space-between;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--sh);font-size:14px;margin:0 0 4px}.fix .fv{text-align:right;font-size:13px;color:var(--mut);white-space:nowrap}
.tot{background:var(--g2);border-radius:var(--rad);padding:12px 14px;margin:0 0 16px}.tot .tl{font-weight:700;font-size:14px}.tot .tv{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;margin:4px 0}.tot .tv .o{color:#a85a12}.tot .tv .g{color:var(--g)}

.badge{display:inline-block;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--g2);color:var(--g)}
.badge.o{background:var(--o2);color:#a2470f}.badge.r{background:var(--r2);color:var(--r)}.badge.n{background:#eef0ea;color:var(--mut)}
.pic .badges{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}

.swap{animation:pop .45s ease}
@keyframes pop{0%{opacity:.2;transform:scale(.98)}100%{opacity:1;transform:none}}
.list{list-style:none;margin:0;padding:0}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .pic{aspect-ratio:4/3}
.close{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:21;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.95);box-shadow:var(--sh);font-size:22px}
table.ing{width:100%;border-collapse:collapse;font-size:14px}
table.ing th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.ing td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.ing td.n{white-space:nowrap;text-align:right;color:#3c463a}
table.ing th.n{text-align:right}
ol.steps{padding:0;margin:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 40px;font-size:15px}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--g);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.portion{font-size:14px;margin:4px 0}
label.lbl{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input.tok{width:100%;padding:13px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
ol.how{padding-left:20px;margin:6px 0;font-size:14.5px}ol.how li{margin:0 0 6px}
.hero{text-align:center;padding:26px 18px 8px}
.hero img{width:84px;height:84px;border-radius:20px}
.small{font-size:13px;color:var(--mut)}
.row{display:flex;gap:10px}.row>*{flex:1}
.hidden{display:none!important}

<body>
<header>
  <img src="icon-192.png" alt="">
  <div class="t"><h1 id="hTitle">Cookies Wochenplaner</h1><div class="sub" id="hSub">Euer Essen für die Woche</div></div>
  <button class="chip hidden" id="saveChip" type="button"></button>
</header>
<main id="main" aria-live="polite"></main>
<nav class="tabs hidden" id="tabs">
  <button data-tab="woche" class="on" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Woche</button>
  <button data-tab="einkauf" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Einkauf</button>
  <button data-tab="einstellungen" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Einstellungen</button>
</nav>
<div id="sheet"></div>
<script>
'use strict';
// ====== Cookies Wochenplaner ======
// Diese App enthält KEINE persönlichen Daten. Plan und Auswahl liegen im PRIVATEN Repo GH_REPO
// und werden nur mit dem GitHub-Schlüssel geladen, der ausschließlich auf diesem Gerät (localStorage) gespeichert ist.
const APP_VER='1.2.0';
const GH_REPO='tinofavetto/cookie-wochenplaner-daten';
const LS_GH='cwp.gh', LS_CACHE='cwp.cache', LS_CHECK='cwp.check.';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CUR=null, CUR_TODAY=null;
let PLAN=null, AUSW=null, AUSW_SHA=null, TAB='woche', LOADERR=null, OFFLINE=false;
let SAVE={state:'idle',timer:null,busy:false,again:false,err:'',at:null};

// ---------- Schlüssel ----------
function ghCfg(){try{const c=JSON.parse(localStorage.getItem(LS_GH)||'null');return c&&c.token?c:null}catch(e){return null}}
function setGhCfg(c){if(c)localStorage.setItem(LS_GH,JSON.stringify(c));else localStorage.removeItem(LS_GH)}
function clearAll(){setGhCfg(null);localStorage.removeItem(LS_CACHE);Object.keys(localStorage).filter(k=>k.startsWith(LS_CHECK)).forEach(k=>localStorage.removeItem(k));PLAN=null;AUSW=null;AUSW_SHA=null}

// ---------- GitHub (Contents API) ----------
function b64enc(str){const u=new TextEncoder().encode(str);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)}
function b64dec(b){const bin=atob(String(b).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function ghErr(st,msg){const m={401:'Der Schlüssel ist falsch oder abgelaufen (HTTP 401).',403:'Der Schlüssel darf auf cookie-wochenplaner-daten nicht zugreifen (HTTP 403). Bei „Repository access“ das Repo wählen und „Contents: Read and write“ geben.',404:'Nichts gefunden oder kein Zugriff auf cookie-wochenplaner-daten (HTTP 404). Prüfe beim Schlüssel „Only select repositories“ → cookie-wochenplaner-daten.',409:'Gleichzeitige Änderung (HTTP 409).',422:'GitHub hat die Datei abgelehnt (HTTP 422).'}[st];const e=new Error(m||('GitHub-Fehler HTTP '+st+(msg?' – '+msg:'')));e.status=st;return e}
async function gh(path,opt,cfg){cfg=cfg||ghCfg();const url='https://api.github.com/repos/'+GH_REPO+(path?'/contents/'+path.split('/').map(encodeURIComponent).join('/'):'');
  try{return await fetch(url+(opt&&opt.method==='PUT'?'':(path?'?ref=main':'')),{...opt,cache:'no-store',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt&&opt.body?{'Content-Type':'application/json'}:{})}})}
  catch(e){const err=new Error('Keine Verbindung zu GitHub.');err.net=true;throw err}}
async function ghGet(path,cfg){const r=await gh(path,{method:'GET'},cfg);if(r.status===404)return null;if(!r.ok){let t='';try{t=(await r.json()).message}catch(e){}throw ghErr(r.status,t)}const j=await r.json();return {data:JSON.parse(b64dec(j.content)),sha:j.sha}}
async function ghPut(path,obj,msg,sha,cfg){const body={message:msg,branch:'main',content:b64enc(JSON.stringify(obj,null,1)+'\n')};if(sha)body.sha=sha;
  const r=await gh(path,{method:'PUT',body:JSON.stringify(body)},cfg);if(!r.ok){let t='';try{t=(await r.json()).message}catch(e){}throw ghErr(r.status,t)}const j=await r.json();return j.content&&j.content.sha}
async function repoPrivate(cfg){const r=await gh('',{method:'GET'},cfg);if(!r.ok){let t='';try{t=(await r.json()).message}catch(e){}throw ghErr(r.status,t)}return !!(await r.json()).private}

// ---------- Daten laden ----------
function cache(){try{return JSON.parse(localStorage.getItem(LS_CACHE)||'null')}catch(e){return null}}
function saveCache(){try{localStorage.setItem(LS_CACHE,JSON.stringify({plan:PLAN,ausw:AUSW,sha:AUSW_SHA,at:Date.now()}))}catch(e){}}
function auswPath(){return 'auswahl/'+PLAN.week+'.json'}
function abendInit(d){return d.abend?{original:d.abend,recipe:d.abend,status:'offen',rejected:[],at:null}:null}
function initAusw(){const now=new Date().toISOString();return {kind:'cookie-auswahl',schema:2,week:PLAN.week,plan:'plan/'+PLAN.week+'.json',updatedAt:now,by:'app',days:PLAN.days.map(d=>{const x={idx:d.idx,date:d.date,original:d.recipe,recipe:d.recipe,status:'offen',rejected:[],at:null};const a=abendInit(d);if(a)x.abend=a;return x})}}
async function load(){
  const cfg=ghCfg();if(!cfg){render();return}
  const c=cache();if(c&&c.plan&&!PLAN){PLAN=c.plan;AUSW=c.ausw;AUSW_SHA=c.sha;render()}
  if(!PLAN)renderLoading();
  try{
    const p=await ghGet('plan/current.json',cfg);
    if(!p||!p.data||p.data.kind!=='cookie-wochenplan')throw new Error('Im privaten Repo liegt noch kein Plan (plan/current.json). Cookie legt ihn sonntags an.');
    const changedWeek=!PLAN||PLAN.week!==p.data.week;PLAN=p.data;
    const a=await ghGet(auswPath(),cfg);
    if(a&&a.data){AUSW=normalize(a.data);AUSW_SHA=a.sha}else if(changedWeek||!AUSW||AUSW.week!==PLAN.week){AUSW=initAusw();AUSW_SHA=null}
    LOADERR=null;OFFLINE=false;saveCache();
  }catch(e){if(e.net&&PLAN){OFFLINE=true}else{LOADERR=e;if(!e.net){PLAN=null;AUSW=null}}}
  render();
}
function normalize(a){const by={};(a.days||[]).forEach(d=>by[d.idx]=d);a.days=PLAN.days.map(d=>{const o=by[d.idx]||{};const x=Object.assign({idx:d.idx,date:d.date,original:d.recipe,recipe:d.recipe,status:'offen',rejected:[],at:null},o);
  if(d.abend){x.abend=Object.assign(abendInit(d),o.abend||{});if(!x.abend.rejected)x.abend.rejected=[]}else delete x.abend;return x});return a}
// ---------- Ersatz-Logik ----------
function R(id){return PLAN&&PLAN.recipes[id]}
function P(n){const p=(PLAN&&PLAN.people)||[];return p[n]||{key:'p'+n,name:'Person '+(n+1),share:n?.4:.6}}
function N(r,n){return r[P(n).key]||{}}
function pickReplacement(i){
  const day=PLAN.days[i],st=AUSW.days[i],crit=PLAN.criteria||{},ref=R(st.original)||R(st.recipe);
  const usedElse=new Set(AUSW.days.filter((x,j)=>j!==i&&x.recipe).map(x=>x.recipe));
  const no=new Set([...(st.rejected||[]),st.recipe,st.original]);
  let c=[...new Set([...(PLAN.pool||[]),...PLAN.days.map(d=>d.recipe)])].filter(id=>R(id)&&!usedElse.has(id)&&!no.has(id));
  if(day.office&&crit.officeNeedsPrep!==false)c=c.filter(id=>R(id).prep);
  const k=id=>N(R(id),0).kcal,p=id=>N(R(id),0).p,rk=N(ref,0).kcal,rp=N(ref,0).p;
  const strict=c.filter(id=>k(id)>=(crit.kcalMin||0)&&k(id)<=(crit.kcalMax||9999)&&p(id)>=(crit.pMin||0)&&Math.abs(k(id)-rk)<=(crit.kcalTol||9999));
  const pool=strict.length?strict:c.filter(id=>p(id)>=(crit.pMin||0)-5);
  if(!pool.length)return null;
  pool.sort((a,b)=>(Math.abs(k(a)-rk)/10+Math.abs(p(a)-rp))-(Math.abs(k(b)-rk)/10+Math.abs(p(b)-rp)));
  return pool[0];
}
// Slot: 'h' = Hauptgericht (Felder direkt am Tag), 'a' = Abendessen (day.abend)
function S(i,slot){const d=AUSW.days[i];return slot==='a'?d.abend:d}
function fixItems(){const k=P(0).key;return ((PLAN.tagesrahmen||{}).fix||[]).filter(f=>(f.who||k)===k)}
function fixSum(){return fixItems().reduce((t,f)=>[t[0]+(f.kcal||0),t[1]+(f.p||0),t[2]+(f.kh||0),t[3]+(f.f||0)],[0,0,0,0])}
function gapFor(i){const z=P(0).ziel||{},fx=fixSum(),m=R(AUSW.days[i].recipe)||R(AUSW.days[i].original),mt=m?N(m,0):{};if(!z.kcal){const o=N(R(AUSW.days[i].abend.original)||{},0);return {kcal:o.kcal||0,p:o.p||0}}return {kcal:z.kcal-fx[0]-(mt.kcal||0),p:(z.p||0)-fx[1]-(mt.p||0)}}
function pickAbend(i){
  const st=AUSW.days[i].abend,crit=PLAN.criteriaAbend||{},g=gapFor(i);
  const usedElse=new Set(AUSW.days.filter((x,j)=>j!==i&&x.abend&&x.abend.recipe).map(x=>x.abend.recipe));
  const no=new Set([...(st.rejected||[]),st.recipe,st.original]);
  const c=[...new Set([...(PLAN.poolAbend||[]),...PLAN.days.map(d=>d.abend).filter(Boolean)])].filter(id=>R(id)&&!usedElse.has(id)&&!no.has(id));
  const k=id=>N(R(id),0).kcal,p=id=>N(R(id),0).p;
  const strict=c.filter(id=>Math.abs(k(id)-g.kcal)<=(crit.kcalTol||90)&&p(id)>=g.p-(crit.pTol||8));

  const p=await ghGet('plan/current.json',cfg);out.push(p?'Plan gefunden: '+esc(p.data.title||p.data.week):'Noch kein Plan im Repo');
  const prev=await ghGet('app/verbindung.json',cfg);
  await ghPut('app/verbindung.json',{app:'cookie-wochenplaner',version:APP_VER,test:new Date().toISOString()},'Verbindungstest aus der App',prev&&prev.sha,cfg);out.push('Schreiben klappt');
  return out}
function renderLoading(){$('#main').innerHTML='<div class="hero"><img src="icon-192.png" alt="" style="width:64px;height:64px"><p class="note">Lade euren Plan …</p></div>'}
function renderError(){$('#tabs').classList.remove('hidden');
  $('#main').innerHTML=`<div class="banner err"><b>Plan konnte nicht geladen werden.</b><br>${esc(LOADERR.message)}</div><div class="row"><button class="btn sec" type="button" data-act="reload">Nochmal laden</button><button class="btn ok" type="button" data-act="gosettings">Schlüssel prüfen</button></div>`}
function render(){
  if(!ghCfg()){renderSetup();return}
  if(TAB==='einstellungen'){setTabs();renderSettings();return}
  if(LOADERR&&!PLAN){setTabs();renderError();return}
  if(!PLAN){renderLoading();return}
  $('#tabs').classList.remove('hidden');$('#hTitle').textContent=PLAN.title||'Cookies Wochenplaner';$('#hSub').textContent=PLAN.range||'';setTabs();chip();
  if(TAB==='einkauf')renderShop();else renderWeek()}
function setTabs(){$('#tabs').classList.remove('hidden');document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB))}

document.addEventListener('click',async e=>{
  const tb=e.target.closest('#tabs button');if(tb){TAB=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,i=+t.dataset.i;
  const sl=t.dataset.s==='a'?'a':'h';
  if(a==='ok'||a==='no'||a==='reset'){act(i,a,sl);if(t.dataset.close){closeSheet();goDay(i,false);const el=$((sl==='a'?'#abend':'#day')+i);if(el)el.scrollIntoView({block:'center'})}}
  else if(a==='jump')goDay(i,true);
  else if(a==='detail')detail(i,sl);
  else if(a==='close')closeSheet();
  else if(a==='retry')doSave();
  else if(a==='reload'){TAB='woche';LOADERR=null;load()}
  else if(a==='gosettings'){TAB='einstellungen';render()}
  else if(a==='copyshop'){try{await navigator.clipboard.writeText(shopText());t.textContent='✓ Kopiert'}catch(err){t.textContent='Kopieren nicht möglich'}}
  else if(a==='tokSave'||a==='tokTest'){
    const old=ghCfg(),v=$('#tok').value.trim(),tok=v||(old&&old.token)||'';const res=$('#tokRes');
    if(!tok){res.innerHTML='<div class="banner err">Bitte den Schlüssel einfügen (beginnt mit github_pat_).</div>';return}
    if(/\s/.test(tok)){res.innerHTML='<div class="banner err">Der Schlüssel enthält Leerzeichen – bitte nur den Schlüssel einfügen.</div>';return}
    res.innerHTML='<div class="small">Verbinde mit GitHub …</div>';
    try{const out=await testKey({token:tok});setGhCfg({token:tok});$('#tok').value='';
      res.innerHTML='<div class="banner info"><b>✓ Verbunden</b><br>'+out.join('<br>')+'</div>';
      if(!PLAN){TAB='woche';setTimeout(load,600)}else{const box=$('#tokRes');if(TAB!=='einstellungen'){TAB='einstellungen';renderSettings(box.innerHTML)}}}
    catch(err){res.innerHTML='<div class="banner err"><b>Nicht verbunden:</b> '+esc(err.message)+'</div>'}}
  else if(a==='tokDel'){if(confirm('Schlüssel und gespeicherten Plan von diesem Gerät löschen?')){clearAll();TAB='woche';render()}}
});
document.addEventListener('change',e=>{const c=e.target.closest('[data-ck]');if(!c)return;const k=LS_CHECK+PLAN.week,o=JSON.parse(localStorage.getItem(k)||'{}');if(c.checked)o[c.dataset.ck]=1;else delete o[c.dataset.ck];localStorage.setItem(k,JSON.stringify(o));c.closest('li').classList.toggle('chk',c.checked)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ghCfg()&&SAVE.state!=='busy'&&SAVE.state!=='pending'){if(SAVE.state==='err')doSave();else load()}});
window.addEventListener('resize',()=>{if(TAB==='woche'&&$('#swipe')&&CUR!=null){setHH();goDay(CUR,false)}});
window.addEventListener('online',()=>{if(SAVE.state==='err')doSave()});
$('#saveChip').addEventListener('click',()=>{if(SAVE.state==='err')doSave()});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{reg.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})})}).catch(()=>{});
  // Neue App-Version aktiv -> einmal neu laden (nur wenn nichts ungespeichert ist)
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;const go=()=>{if(SAVE.state==='pending'||SAVE.state==='busy'){setTimeout(go,800);return}reloaded=true;location.reload()};if(hadCtrl)go()});
  var hadCtrl=!!navigator.serviceWorker.controller}
if(location.hash==='#rezept')history.replaceState(null,'',location.pathname);
render();load();
</script>
</body>
</html>
